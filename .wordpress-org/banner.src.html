<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1544px; height:500px; overflow:hidden; }
  .banner {
    width:1544px; height:500px; display:flex; align-items:center;
    font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    background:linear-gradient(90deg,#fff5f8 0%,#ffffff 55%);
    padding:100px 108px;
    gap:48px;
  }
  .left { flex:0 0 520px; display:flex; flex-direction:column; justify-content:center; }
  .brand { display:flex; align-items:center; gap:16px; }
  .brand img { width:56px; height:56px; border-radius:12px; }
  .brand h1 { font-size:48px; font-weight:800; color:#0b1533; letter-spacing:-1px; line-height:1; }
  .sub { font-size:22px; color:#c2255c; font-weight:700; margin:18px 0 24px; }
  ul { list-style:none; display:flex; flex-direction:column; gap:16px; }
  li { display:flex; align-items:center; gap:12px; font-size:20px; color:#1a2540; font-weight:600; }
  .dot { width:26px; height:26px; border-radius:50%; background:#c2255c; flex:0 0 auto; }
  .right { flex:1; height:100%; display:flex; align-items:center; justify-content:flex-end; }
  .card {
    height:100%; width:auto; max-width:720px; border-radius:18px; overflow:hidden; background:#fff;
    box-shadow:0 24px 56px rgba(20,40,90,.18);
  }
  .card img { height:100%; width:auto; object-fit:cover; object-position:top left; display:block; }
</style>
</head>
<body>
  <div class="banner">
    <div class="left">
      <div class="brand">
        <img src="icon-256x256.png" alt="">
        <h1>Shortlist</h1>
      </div>
      <div class="sub">Wishlist for WooCommerce</div>
      <ul>
        <li><span class="dot"></span><span>Save without an account</span></li>
        <li><span class="dot"></span><span>My Account wishlist tab</span></li>
        <li><span class="dot"></span><span>No jQuery, no layout shift</span></li>
      </ul>
    </div>
    <div class="right">
      <div class="card"><img src="screenshot-1.png" alt=""></div>
    </div>
  </div>
</body>
</html>
